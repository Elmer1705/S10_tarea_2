{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Tienda{% endblock %}</title>
    <!-- Hoja de estilos CSS personalizada -->
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2>Mi Tienda</h2>
        </div>
        <nav>
            <ul>
                <li><a href="{% url 'home' %}">Inicio</a></li>
                <li><a href="/admin/">Administración</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor">
        {% block content %}
        <!-- Aquí se inyecta el contenido de cada página -->
        {% endblock %}
    </main>

    <footer>
        <p>&copy; {% now "Y" %} Mi Tienda - Todos los derechos reservados</p>
    </footer>
</body>
</html>
