<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Marcas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Gestión de Marcas</h1>
    <hr>
    
    <div class="mb-3">
        <a href="{% url 'marca_create' %}" class="btn btn-primary">Nueva Marca</a>
        <a href="{% url 'producto_list' %}" class="btn btn-secondary">Ver Productos</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>País de Origen</th>
                <th>Activo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for marca in marcas %}
            <tr>
                <td>{{ marca.nombre }}</td>
                <td>{{ marca.pais_origen }}</td>
                <td>{{ marca.activo|yesno:"Sí,No" }}</td>
                <td>
                    <a href="{% url 'marca_update' marca.id %}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="{% url 'marca_delete' marca.id %}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No hay marcas registradas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
