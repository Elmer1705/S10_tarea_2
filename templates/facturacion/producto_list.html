<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Inventario de Productos</h1>
    <hr>
    
    <div class="mb-3">
        <a href="{% url 'producto_create' %}" class="btn btn-primary">Nuevo Producto</a>
        <a href="{% url 'marca_list' %}" class="btn btn-secondary">Ver Marcas</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Marca</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for producto in productos %}
            <tr>
                <td>{{ producto.nombre }}</td>
                <td>${{ producto.precio }}</td>
                <td>{{ producto.stock }}</td>
                <td>{{ producto.marca.nombre }}</td>
                <td>
                    <a href="{% url 'producto_update' producto.id %}" class="btn btn-warning btn-sm">Editar</a>
                    <a href="{% url 'producto_delete' producto.id %}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">No hay productos registrados.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
