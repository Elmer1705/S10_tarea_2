<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-danger shadow">
                <div class="card-body text-center">
                    <h3 class="text-danger">¿Estás seguro?</h3>
                    <p class="mt-3">¿Deseas eliminar el producto: <strong>{{ object.nombre }}</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger w-100">Sí, eliminar</button>
                    </form>
                    <a href="{% url 'producto_list' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
